[project]
name = "tf-convert-pricer"
version = "0.0.1"
description = "Tsiveriotis-Fernandes convertible bond pricer and risk analyzer"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "matplotlib",
]
web = [
    "streamlit",
    "plotly",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tf_convert_pricer"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
